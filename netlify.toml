[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: everything that is not a real file falls through to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed bundles are immutable; the datasets are not.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
